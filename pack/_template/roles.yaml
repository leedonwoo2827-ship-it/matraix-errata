# ◆ADsP 예시 — 이 파일 전체가 ADsP 를 예로 채운 것이다. 새 시험에 맞게 자리(관점)·조건(차원 값)을 고친다.
#   차원·값은 data/engine/MatrAIx-Persona-8B/persona/schema/dimensions.json 에 있는 것만 쓴다.
# ADsP 검수단 — 산물별 역할 (대략). 06_검수표/검수기록.xlsx 「검수단 역할」 시트가 읽는다.
#
# ★ 열쇠는 persona.yaml 의 자리 id(E1~E4)·수험생 층 id(L-상·L-중·L-하) — 검수단을 다시 뽑아도 역할은 자리를 따라간다.
# ★ 이 표는 「누가 무엇을 맡는가」만 적는다. 지적이 옳은지·반영할지는 정오표 엑셀에서 사람이 따로 판정한다.
# ★ 고도화: 산물이 새로 들어오거나 검토 결과를 보고 역할을 고칠 때 여기만 고친다(검토 프롬프트에는 아직 넣지 않았다 —
#   넣으려면 s03_review.build_prompt 에서 읽게 한다).
# 산물: Q 문항·해설 · V 문제풀이 영상 · S 요약노트 · D 덱 · L 롱폼 · B 교재 · T 쇼츠

products: [Q, V, S, D, L, B, T]

roles:
  E1:   # 통계·근거
    Q: 눈가림 풀이로 정답이 하나인지 확인. 통계 정의·공식·계산 결과 대조
    V: (검토 없음) Q 검토에서 해설 낭독의 수치·공식 읽기를 함께 본다
    S: 통계 정의·공식·분류의 사실 확인, 항목끼리 수치·정의 모순
    D: (검토 없음) 내용은 L·Q 검토로 갈음
    L: 예제 풀이·수식 전개 검증, 화면 수식과 자막 설명의 일치
    B: 정의·공식·예제 계산의 정확성, 핵심 정리 상자의 공식이 본문과 같은지
    T: 짧게 줄이면서 틀린 말이 된 통계 주장(과장·단정) 확인
  E2:   # 데이터분석 실무
    Q: R·데이터마트·마이닝 문항의 보기가 실제 동작과 맞는지, 함수명·옵션 확인
    V: (검토 없음) Q 검토에서 R 함수명·코드 읽기를 함께 본다
    S: R 기초·데이터마트·정형 마이닝 기법 설명의 실무 정확성
    D: (검토 없음) 내용은 L·Q 검토로 갈음
    L: R 코드·실습 화면과 설명의 일치, 기법 설명이 실제 동작과 맞는지
    B: 기법·알고리즘 설명, 코드 예시의 정확성
    T: 기법 용어를 실무와 다르게 단정한 표현 확인
  E3:   # 강의·출제
    Q: 오답 보기가 확실히 오답인지, 출제 범위 안인지, 수험생이 오해할 문제문인지
    V: (검토 없음) Q 검토에서 해설 낭독이 해설과 같은 말인지 함께 본다
    S: 시험 범위를 벗어난 서술, 학습 순서상 오해를 부르는 정리
    D: (검토 없음) 내용은 L·Q 검토로 갈음
    L: 강의 흐름에서 오해를 부르는 설명, 화면·자막 어긋남, 출제 포인트 누락
    B: 절 구성상 오해, 주의 상자가 본문과 다른지, 범위 밖 서술
    T: 제목·설명·고정댓글이 본문과 다르거나 수험생을 오도하는지
  E4:   # 교정·사실확인
    Q: 표기·용어 흔들림, 숫자·기호 표기, 해설과 해설 낭독의 어긋남
    V: (검토 없음) Q 검토에서 낭독 표기를 함께 본다
    S: 산물끼리 같은 개념의 다른 표기, 띄어쓰기·용어 통일
    D: (검토 없음) 내용은 L·Q 검토로 갈음
    L: TTS 발음 대본의 잘못 읽기(숫자·영문 약어·기호·수식), 자막 표기
    B: 표기·띄어쓰기·용어 통일, 교재 안의 사실 확인(기관명·연도)
    T: 자막·칩·제목의 표기, 확인 못 한 주장 표시(웹확인)
  L-상: # 수험생 상 — 데이터 분석을 해 본 사람
    Q: 개념은 알지만 시험 범위·출제 의도가 헷갈리는 곳
    S: 범위 확인용으로 읽을 때 빠지거나 넘치는 곳
    L: 이미 아는 사람이 보기에 부정확하거나 지나치게 단순화한 설명
    B: 범위 확인용으로 읽을 때 빠지거나 넘치는 곳
    T: 과장으로 들리는 주장
  L-중: # 수험생 중 — 엑셀·SQL 정도
    Q: 통계 용어에서 막히는 문제문·보기
    S: 용어 설명 없이 넘어가는 곳
    L: 통계 용어가 처음 나오는데 풀이가 없는 곳
    B: 용어 설명 없이 넘어가는 곳
    T: 짧아서 오해하기 쉬운 자막
  L-하: # 수험생 하 — 처음 공부하는 사람
    Q: 문제문 자체를 오해할 표현, 해설이 건너뛰는 단계
    S: 처음 보는 용어가 한꺼번에 나오는 곳
    L: 따라가지 못하는 속도·순서, 앞에서 안 나온 용어
    B: 처음 보는 용어가 한꺼번에 나오는 곳
    T: 처음 듣는 사람이 잘못 기억할 문장
