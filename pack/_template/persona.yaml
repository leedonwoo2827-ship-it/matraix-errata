# ★ 템플릿 — 아래는 ADsP 예시다. 새 시험에 맞게 자리(관점)·조건(차원 값)을 고친다.
#   차원·값은 data/engine/MatrAIx-Persona-8B/persona/schema/dimensions.json 에 있는 것만 쓴다.
# ═══════════════════════════════════════════════════════════════════════════
#  ADsP 산물 검수단 — 검수진 4 + 수험생 6 (합 10명)
#
#  ★ 엔진(260810-MatrAIx-검토분석엔진)의 tools/sample_panel.py 가 읽는다.
#    errata/s01_panel.py 가 이 파일을 엔진 packs/adsp-qa/persona.yaml 로 복사해서 돌린다.
#  ★ 차원·값은 MatrAIx-Persona-8B/persona/schema/dimensions.json 에 있는 것만 썼다
#    (fam_statistics · fam_data_science · skill_data_analysis · skill_editing · skill_fact_checking 확인 2026-10-08).
#  ★ 엔진 용어로 author = 검수진(판정하는 사람), reviewer = 수험생 층(읽는 사람).
#    검수는 쓰는 일이 아니므로 저자진 자리를 검수진으로 돌려 쓴다.
# ═══════════════════════════════════════════════════════════════════════════

source:
  dataset: MatrAIx2026/MatrAIx_Persona_1M_Public_Release
  local: MatrAIx-Persona-8B/persona/datasets/matraix-persona-1m/release
  codes_schema: persona_codes.schema.json
  shards:
    - data/persona-1m-0005.parquet
    - data/persona-1m-0004.parquet
  prefer_sources: [real_human_survey, stackoverflow, prism, gss]

seed: 20261008

# 공통 — 데이터·통계를 아는 사람
common:
  must_any:
    - fam_data_science: [Expert, Proficient, Familiar, Aware]
    - fam_statistics: [Expert, Proficient, Familiar, Aware]
    - skill_data_analysis: [Master, Advanced, Intermediate, Beginner]
    - domain: [Software & AI]

# ── 검수진 4명 — 판정하는 사람들 ────────────────────────────────────────────
author:
  n: 4
  note: "ADsP 산물의 사실·정답·표기를 판정한다. 관점을 갈라 같은 것을 함께 놓치지 않게 한다."
  common:
    must:
      age_bracket: ["25-34", "35-44", "45-54", "55-64"]
    prefer:
      years_experience: ["6-10", "11-20", "20+"]
      region: [East Asia]
      lang_korean: [Native, Fluent]

  seats:
    - id: E1
      view: 통계·근거
      asks: "정의·공식·수치가 맞는가. 통계 용어를 한 뜻으로만 쓰는가. 정답이 정말 하나인가."
      must:
        fam_statistics: [Expert, Proficient]
      prefer:
        highest_education: ["Master's", "Doctorate", "Postdoc"]
        role_function: [Research]
        skill_mathematics: [Master, Advanced]

    - id: E2
      view: 데이터분석 실무
      asks: "R·데이터마트·마이닝 기법 설명이 실제 동작과 맞는가. 실무에서 틀린 말은 없는가."
      must:
        fam_data_science: [Expert, Proficient]
      prefer:
        skill_data_analysis: [Master, Advanced]
        domain_characteristics: [Practitioner]
        domain: [Software & AI]

    - id: E3
      view: 강의·출제
      asks: "수험생이 오해할 서술은 없는가. 보기가 출제 범위 안에 있고, 오답이 명확히 오답인가."
      must_any:
        - role_function: [Teaching]
        - domain_characteristics: [Educator]
      prefer:
        fam_statistics: [Expert, Proficient, Familiar]
        skill_public_speaking: [Master, Advanced]

    - id: E4
      view: 교정·사실확인
      asks: "산물끼리 말이 같은가. 표기·띄어쓰기·숫자 읽기가 흔들리지 않는가. 확인 못 한 주장은 무엇인가."
      must_any:
        - skill_fact_checking: [Master, Advanced]
        - skill_editing: [Master, Advanced]
      prefer:
        skill_critical_thinking: [Master, Advanced]
        lang_korean: [Native, Fluent]

# ── 수험생 6명 — 읽는 사람들 (층을 가른다) ─────────────────────────────────
reviewer:
  n: 6
  note: "이 강의·책을 사서 공부할 사람. 어디서 막히는지, 무엇을 오해할지 말한다."
  reads: "산물 본문(문항·낭독·교재). 정답 판정은 검수진이 한다."
  strata:
    - id: L-상
      n: 2
      desc: "데이터 분석을 해 본 사람. 개념은 알고 시험 범위만 확인한다."
      must:
        skill_data_analysis: [Master, Advanced]
      prefer:
        age_bracket: ["25-34", "35-44"]
    - id: L-중
      n: 2
      desc: "엑셀·SQL 정도를 다뤄 본 사람. 통계 용어에서 막힌다."
      must:
        skill_data_analysis: [Intermediate]
      prefer:
        age_bracket: ["18-24", "25-34"]
    - id: L-하
      n: 2
      desc: "처음 공부하는 사람. 용어 하나하나가 낯설다."
      must:
        skill_data_analysis: [Beginner, None]
      prefer:
        age_bracket: ["18-24", "25-34"]

selection:
  rule: "must 전부 통과 → prefer 맞은 개수로 점수 → 높은 순. 같으면 prefer_sources, 그다음 씨앗 해시."
  order: [author, reviewer]
  unique: true

require:
  - "지적은 원문을 그대로 인용한다(as_is). 요약하면 어디를 고쳐야 할지 모른다."
  - "근거를 못 대면 confidence 를 '의심' 으로 둔다. 외부 확인이 필요하면 needs_web 을 켠다."
  - "지적이 없으면 없다고 적는다. 빈칸은 안 읽은 것과 구분이 안 된다."

limits: >
  이 표본은 가상의 응답자다. 실제 수험생·전문가 검수를 대체하지 않는다.
  검수단의 판정은 사람이 정오표 엑셀에서 반영·보류·거절로 확정한다.
