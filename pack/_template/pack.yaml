# 새 시험(종목) 검수 팩 — 이 폴더를 data/pack/<팩이름>/ 으로 복사해서 채운다. (CLAUDE.md 「처음 시작」 대화가 대신 만든다)
# 분야 지식은 여기에만 둔다. errata/ 코드는 시험을 모른다.
slug: <팩이름>                 # 예: adsp, sqld, nurse-kr
label: <시험 이름 전체>         # 예: ADsP 데이터분석 준전문가
exam: <시험 약칭>               # 예: ADsP
subjects:                      # 과목 번호: 과목 이름
  1: <1과목>
  2: <2과목>

# 문항 보기 수 (기계검사 Q-choices)
choices: 4

# 쇼츠 산물 폴더 안의 과목 폴더 이름 (glob). 예: "ADsP-*"
shorts_glob: "*"

# 쇼츠·메타의 시험 라벨 — 이 팩의 시험이 아닌 라벨이 붙으면 '라벨' 오류
right_labels: ["<시험 약칭>"]
wrong_labels: []               # 헷갈리기 쉬운 다른 시험 이름

# 산물 본문에 나오면 안 되는 말 — 낱말: 바꿀 말 (빈 값이면 지운다)
banned_words:
  "{원본링크}": ""
  "TODO": ""
  "TBD": ""

# 검토단에게 주는 범위 설명 (출제기준 공개 범위 — 주관 기관·과목·세부 항목·문항 수·형식)
scope: >
  <시험 이름>(<주관 기관>) 필기. <과목별 범위>. <문항 수>, <형식>.

# 검토 배치 크기
batch:
  Q: 10        # 문항 10개 = 문제풀이 영상 1편
